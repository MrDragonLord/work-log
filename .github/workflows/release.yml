name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish Windows artifacts
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.11.1

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build Tauri application and installers
        run: corepack pnpm build:tauri

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worklog-${{ github.ref_name }}-windows-x64
          path: |
            src-tauri/target/release/work-log.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $portableExe = 'src-tauri/target/release/work-log.exe'
          $setup = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' -File | Select-Object -First 1
          $msi = Get-ChildItem -Path 'src-tauri/target/release/bundle/msi' -Filter '*.msi' -File | Select-Object -First 1

          if (-not (Test-Path -LiteralPath $portableExe) -or $null -eq $setup -or $null -eq $msi) {
            throw 'Required release artifacts were not found.'
          }

          $assets = @($portableExe, $setup.FullName, $msi.FullName)
          gh release view $tag *> $null

          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag $assets --title "WorkLog $tag" --generate-notes
          }
